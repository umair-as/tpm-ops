name: dependency-security

# GitHub Actions requires the YAML 1.1 boolean-like key `on`.
# yamllint disable-line rule:truthy
on:
  # No path filter on pull_request: `cargo deny` is a required status check
  # on main's branch protection, so it must run (and report) on every PR
  # regardless of which files changed — a required context that never
  # triggers blocks that PR from merging forever. Cheap enough (~30s) that
  # running it unconditionally costs little. `push` keeps the path filter
  # since nothing there depends on it reporting to unblock a merge.
  pull_request:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/dependency-security.yml"
  schedule:
    # Re-check license/source/duplicate-dependency policy when it drifts,
    # independent of the RustSec advisory rescan already in ci.yml.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # EmbarkStudios/cargo-deny-action v2.0.18
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1
        with:
          command: check bans licenses sources
