---
name: CI

# GitHub Actions requires the YAML 1.1 boolean-like key `on`.
# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-scan the lockfile when the RustSec advisory database changes.
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: error

jobs:
  build-lint:
    name: Build & Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Install tpm2-tss dev headers
        run: sudo apt-get install -y --no-install-recommends libtss2-dev

      - name: Cache cargo registry
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked -- -D warnings

      - name: cargo build
        run: cargo build --release --locked

  cross-build-aarch64:
    name: Cross-build (aarch64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 cross toolchain and sysroot packages
        run: |
          sudo dpkg --add-architecture arm64

          # GitHub-hosted runners' default mirrors (notably security.ubuntu.com)
          # don't carry non-native architectures, so a plain `apt-get update`
          # 404s on arm64 indices once the foreign architecture is added.
          # Restrict the runner's existing sources to its native architecture
          # and add a dedicated arm64 source pointed at the official ports
          # mirror, which does carry it.
          native_arch="$(dpkg --print-architecture)"
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -e "$f" ] || continue
            sudo sed -i "/^Types:/a Architectures: ${native_arch}" "$f"
          done
          if [ -e /etc/apt/sources.list ]; then
            sudo sed -i "s/^deb \(http\|mirror\)/deb [arch=${native_arch}] \1/" /etc/apt/sources.list
          fi

          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-security ${VERSION_CODENAME}-backports
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            qemu-user-static \
            libtss2-dev:arm64 \
            libc6-dev:arm64 \
            libssl-dev:arm64

      - name: Cache cargo registry
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-aarch64-

      - name: Cross-build for aarch64
        # Compile + link only — this runner cannot execute an aarch64 binary
        # natively. Reuses the same script a human runs locally so CI and the
        # documented cross-compile flow can't drift apart. Prints arch,
        # NEEDED libraries, and the glibc floor the binary requires.
        run: SYSROOT=/ ./scripts/cross-build-aarch64.sh

      - name: Smoke-test cross-built binary under qemu
        run: |
          qemu-aarch64-static -L / target/aarch64-unknown-linux-gnu/release/tpm-ops version

  integration-test:
    name: Integration Tests (swtpm)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            libtss2-dev \
            libtss2-tcti-swtpm0 \
            swtpm \
            swtpm-tools

      - name: Cache cargo registry
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo build
        run: cargo build --release --locked

      - name: Start swtpm
        run: |
          mkdir -p /tmp/swtpm
          swtpm socket \
            --tpmstate dir=/tmp/swtpm \
            --ctrl type=tcp,port=2322 \
            --server type=tcp,port=2321 \
            --tpm2 \
            --flags startup-clear \
            --daemon
          # Wait for swtpm to be ready
          timeout 5 bash -c 'until ss -tlnp | grep -q 2321; do sleep 0.1; done'

      - name: Run integration tests
        run: ./target/release/tpm-ops --tcti "swtpm:port=2321" test

      - name: Stop swtpm
        if: always()
        run: pkill swtpm || true

  security-audit:
    name: RustSec Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: cargo audit --deny warnings

      - name: Write machine-readable audit report
        if: always()
        run: |
          mkdir -p artifacts
          cargo audit --json > artifacts/rustsec-audit.json \
            || test -s artifacts/rustsec-audit.json

      - name: Upload audit report
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tpm-ops-rustsec-audit
          path: artifacts/rustsec-audit.json
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: CycloneDX SBOM
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install tpm2-tss dev headers
        run: sudo apt-get install -y --no-install-recommends libtss2-dev

      - name: Install pinned CycloneDX generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Build release binary from locked dependencies
        run: cargo build --release --locked

      - name: Generate CycloneDX 1.5 JSON SBOM
        run: |
          mkdir -p artifacts
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --override-filename tpm-ops.cdx
          mv tpm-ops.cdx.json artifacts/tpm-ops.cdx.json
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.5"' \
            artifacts/tpm-ops.cdx.json >/dev/null

      - name: Upload SBOM
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tpm-ops-cyclonedx-sbom
          path: artifacts/tpm-ops.cdx.json
          if-no-files-found: error
          retention-days: 90
